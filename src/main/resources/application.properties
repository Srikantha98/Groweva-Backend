spring.application.name=Evabirds
server.port=8081

# Server Compression (Reduces JSON/Asset Bandwidth by up to 75%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# PostgreSQL Database Configuration (Aiven Cloud / Managed / Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/evabirds}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Srikanth@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Enterprise Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=EvabirdsHikariCP

# Hibernate & JPA Enterprise Optimization
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# JWT Authentication
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Automatic Image Optimization & GrowEva Watermark System
cloudinary.optimization.max-width=1600
cloudinary.optimization.quality=auto:good
cloudinary.optimization.format=auto
cloudinary.optimization.thumbnail-width=600
cloudinary.optimization.thumbnail-height=400
cloudinary.optimization.preserve-original=true

# GrowEva Watermark Specification (Farm Photos Only)
cloudinary.watermark.enabled=true
cloudinary.watermark.brand-text=GrowEva
cloudinary.watermark.asset-id=${CLOUDINARY_WATERMARK_ASSET:}
cloudinary.watermark.opacity=70
cloudinary.watermark.gravity=south_east
cloudinary.watermark.x-offset=25
cloudinary.watermark.y-offset=25

# Task Execution & Scheduling (Async Thread Pool)
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=evabirds-async-

# Enterprise Observability & Actuator Health Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Springdoc OpenAPI 3 / Swagger UI Specification
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Environment Configuration Import (.env file support)
spring.config.import=optional:file:.env[.properties]

# Mail & SMTP Configuration (Gmail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
